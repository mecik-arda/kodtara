[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kodtara"
version = "1.0.0"
description = "LLM uygulaması kodunda güvensiz prompt kurma ve çıktı işleme kalıpları için statik tarayıcı"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Arda Meçik"}]
keywords = [
    "llm-security",
    "static-analysis",
    "sast",
    "prompt-injection",
    "owasp-llm",
    "code-audit",
    "turkce",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = [
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mecik-arda/kodtara"
Issues = "https://github.com/mecik-arda/kodtara/issues"

[project.scripts]
kodtara = "kodtara.cli:ana"

[tool.setuptools.packages.find]
include = ["kodtara*"]

[tool.ruff]
line-length = 110
target-version = "py311"
# ornekler/ kasitli olarak riskli kod ornekleridir; tarayici ciktisi beklenir.
extend-exclude = ["ornekler"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Regex tanimlari kasitli olarak tek satirda tutulur; bolmek desenin
# okunabilirligini ve butunluk denetimini bozar.
"kodtara/tarayici.py" = ["E501"]
"tests/*" = ["E501"]
